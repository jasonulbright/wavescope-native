name: Signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v1.1.1)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: signed-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Validate requested tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected vMAJOR.MINOR.PATCH' }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Match tag to binary version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $text = Get-Content src/version.h -Raw
          if ($text -notmatch '#define WAVESCOPE_VERSION L"(\d+\.\d+\.\d+)"') { throw 'Missing version' }
          $version = $Matches[1]
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag and binary version differ' }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: projectM-visualizer/projectm
          ref: 149bfc43963e54e397ccdb42f27019d22b659098
          path: .deps/projectm
          submodules: recursive
          persist-credentials: false
      - name: Build pinned projectM
        shell: pwsh
        run: ./scripts/build-projectm.ps1
      - name: Build, test and stage portable release
        shell: pwsh
        # GPU tests are a documented local release prerequisite.
        run: ./scripts/package.ps1 -SkipRenderTest -StageOnly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release
          path: dist/WaveScope-v${{ steps.version.outputs.version }}-win64/
          if-no-files-found: error
          retention-days: 7
  sign:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release
          path: dist/WaveScope-v${{ needs.build.outputs.version }}-win64/
      - name: Azure login using the release environment federation
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign WaveScope and projectM binaries
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: signalridgelabs
          certificate-profile-name: SRL-Public
          files: |
            ${{ github.workspace }}\dist\WaveScope-v${{ needs.build.outputs.version }}-win64\WaveScope.exe
            ${{ github.workspace }}\dist\WaveScope-v${{ needs.build.outputs.version }}-win64\projectM-4.dll
            ${{ github.workspace }}\dist\WaveScope-v${{ needs.build.outputs.version }}-win64\projectM-4-playlist.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-managed-identity-credential: true
          exclude-workload-identity-credential: true
          exclude-azure-cli-credential: false
      - name: Verify signer and timestamp, then package and hash
        shell: pwsh
        run: ./scripts/package.ps1 -FinalizeSigned
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
  draft:
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release
          path: release
      - name: Create a draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "WaveScope $RELEASE_TAG" --generate-notes
          fi
